<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>FocusRemote</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Login -->
  <main id="loginView" class="login">
    <form id="loginForm" class="card" autocomplete="on" novalidate>
      <h1>FocusRemote</h1>
      <label>Relay
        <input id="relayInput" name="relay" type="url" inputmode="url" autocomplete="off" spellcheck="false" required>
      </label>
      <label>Id
        <input id="idInput" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false"
               pattern="[A-Za-z0-9_\-]{3,64}" required>
      </label>
      <label>Password
        <input id="passwordInput" name="password" type="password" autocomplete="current-password" minlength="10" required>
      </label>
      <p id="loginError" class="error" role="alert" hidden></p>
      <p id="loginStatus" class="status" aria-live="polite"></p>
      <button id="connectButton" type="submit" class="primary">Kết nối</button>
      <p id="envWarning" class="warning" hidden></p>
    </form>
  </main>

  <!-- Remote session -->
  <div id="sessionView" class="session" hidden>
    <header class="toolbar">
      <button id="sourcesButton" type="button" title="Danh sách cửa sổ/màn hình">☰ Nguồn</button>
      <span id="hostName" class="host-name"></span>
      <span id="latency" class="latency" title="Độ trễ khứ hồi">– ms</span>
      <span class="spacer"></span>
      <select id="touchModeSelect" title="Chế độ chạm" hidden>
        <option value="direct">Chạm trực tiếp</option>
        <option value="touchpad">Touchpad</option>
      </select>
      <button id="keyboardButton" type="button" title="Bàn phím ảo" hidden>⌨</button>
      <button id="muteButton" type="button" title="Bật/tắt tiếng">🔇</button>
      <button id="fullscreenButton" type="button" title="Toàn màn hình">⛶</button>
      <button id="disconnectButton" type="button" title="Ngắt kết nối">✕</button>
    </header>

    <div class="body">
      <aside id="sourcesPanel" class="sources">
        <div class="sources-head">
          <strong>Nguồn</strong>
          <button id="refreshSourcesButton" type="button" title="Tải lại danh sách">⟳</button>
        </div>
        <label class="bitrate">Bitrate
          <select id="bitrateSelect">
            <option value="1000">1 Mbps</option>
            <option value="2000">2 Mbps</option>
            <option value="4000" selected>4 Mbps</option>
            <option value="8000">8 Mbps</option>
            <option value="15000">15 Mbps</option>
          </select>
        </label>
        <ul id="sourceList" class="source-list"></ul>
        <button id="stopStreamButton" type="button" disabled>Dừng xem</button>
      </aside>

      <section id="stage" class="stage" tabindex="0">
        <canvas id="videoCanvas"></canvas>
        <div id="cursor" class="cursor" hidden></div>
        <p id="stageMessage" class="stage-message">Chọn một cửa sổ hoặc màn hình để xem.</p>
      </section>
    </div>

    <textarea id="softInput" class="soft-input" autocapitalize="off" autocomplete="off" spellcheck="false" aria-hidden="true"></textarea>

    <div id="overlay" class="overlay" hidden>
      <div class="card">
        <p id="overlayText"></p>
        <div class="row">
          <button id="reconnectButton" type="button" class="primary">Kết nối lại</button>
          <button id="backButton" type="button">Đăng nhập lại</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
